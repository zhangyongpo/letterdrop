name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # 允许在 GitHub 网页上手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      # GitHub runner 预置了 ANDROID_SDK_ROOT 指向 /usr/local/lib/android/sdk，
      # 与 ANDROID_HOME 不一致会让 AGP 报 "different paths to the SDK" 而失败，这里统一成同一个。
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 手动安装官方 Android 命令行工具（避免第三方动作不兼容）
      - name: Install Android command-line tools
        run: |
          SDK=$ANDROID_HOME
          mkdir -p $SDK/cmdline-tools
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d $SDK/cmdline-tools
          mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH

      # 接受许可并安装编译所需组件（显式指定 sdk_root，确保装到 ANDROID_HOME）
      - name: Accept licenses & install SDK packages
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: |
          # 编译时只保留 ANDROID_HOME 一种 SDK 注入方式，彻底避免多来源冲突
          unset ANDROID_SDK_ROOT
          gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
